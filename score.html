<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#2B2420">
<title>点数ボード</title>
<link rel="stylesheet" href="style.css?v=8">
<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script src="config.js?v=8"></script>
<script src="common.js?v=8"></script>
<style>
  /* 点数ボード専用（全画面で使う） */
  html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }
  body.board {
    background: var(--ink); color: #fff;
    display: flex; flex-direction: column; height: 100dvh;
    padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    touch-action: manipulation;
  }

  .bar { display: flex; align-items: center; gap: 6px; padding: 8px 10px; flex: none; }
  .bar button {
    min-height: 44px; min-width: 44px; padding: 0 12px; border: none; border-radius: 12px;
    background: rgba(255, 255, 255, .12); color: #fff; font-family: inherit; font-size: 14px; font-weight: 700;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px; cursor: pointer; white-space: nowrap;
  }
  .bar button:disabled { opacity: .35; }
  .bar button:active { background: rgba(255, 255, 255, .25); }
  .bar .target { margin-right: auto; background: var(--yellow); color: var(--ink); font-size: 16px; }
  .bar .target b { font-size: 20px; }
  .bar svg { width: 20px; height: 20px; }

  .court { flex: 1; display: flex; flex-direction: column; gap: 6px; padding: 0 6px 6px; min-height: 0; }

  .side {
    position: relative; flex: 1; min-height: 0; border-radius: 20px; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; -webkit-tap-highlight-color: transparent;
    transition: box-shadow .15s;
  }
  .side.s0 { background: var(--green); }
  .side.s1 { background: #24415E; }
  .side:active::after { content: ""; position: absolute; inset: 0; background: rgba(255, 255, 255, .08); }
  .side.bump .pts { animation: bump .18s ease-out; }
  @keyframes bump { 0% { transform: scale(1.08); } 100% { transform: scale(1); } }

  /* サーブ側を強調 */
  .side.serving { box-shadow: inset 0 0 0 6px var(--yellow); }
  .side .serve {
    position: absolute; top: 14px; left: 14px; pointer-events: none;
    font-size: clamp(14px, 3.6vmin, 20px); font-weight: 800;
    background: var(--yellow); color: var(--ink); padding: 5px 14px; border-radius: 999px;
  }

  .side .pts {
    font-size: min(34dvh, 62vw); line-height: 1; font-weight: 800;
    font-variant-numeric: tabular-nums; letter-spacing: -.02em; pointer-events: none;
  }
  .side .minus {
    position: absolute; right: 10px; bottom: 10px; width: 56px; height: 56px; border-radius: 16px;
    border: none; background: rgba(0, 0, 0, .25); color: #fff; font-size: 30px; font-weight: 800;
    font-family: inherit; cursor: pointer; display: flex; align-items: center; justify-content: center;
  }
  .side .minus:disabled { opacity: .3; }

  /* 横向き：左右に並べる */
  @media (orientation: landscape) {
    .court { flex-direction: row; }
    .side .pts { font-size: min(62dvh, 30vw); }
  }

  /* ゲーム終了 */
  .over {
    position: fixed; inset: 0; z-index: 50; background: rgba(20, 16, 14, .82);
    display: flex; align-items: center; justify-content: center; padding: 20px;
  }
  .over-card {
    width: 100%; max-width: 360px; background: #fff; color: var(--ink); border-radius: 22px;
    padding: 22px 20px 18px; display: flex; flex-direction: column; gap: 12px; text-align: center;
  }
  .over-card .ttl { font-size: 22px; font-weight: 800; }
  .final { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 8px; }
  .final div {
    position: relative; border-radius: 16px; padding: 14px 0; color: #fff;
    font-size: 48px; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1;
  }
  .final .f0 { background: var(--green); }
  .final .f1 { background: #24415E; }
  .final .win::after {
    content: "勝ち"; position: absolute; top: -10px; left: 50%; transform: translateX(-50%);
    font-size: 13px; background: var(--yellow); color: var(--ink); padding: 3px 12px; border-radius: 999px;
  }

  /* 先取点の設定 */
  .sheet-bg { position: fixed; inset: 0; z-index: 60; background: rgba(20, 16, 14, .6); display: flex; align-items: flex-end; justify-content: center; }
  .sheet {
    width: 100%; max-width: 520px; max-height: 92dvh; overflow-y: auto;
    background: var(--bg); color: var(--ink); border-radius: 22px 22px 0 0;
    padding: 20px 18px calc(18px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 16px;
  }
  @media (orientation: landscape) { .sheet-bg { align-items: center; } .sheet { border-radius: 22px; max-height: 96dvh; } }
  .sheet h2 { margin: 0; font-size: 18px; }
  .stepper { display: grid; grid-template-columns: 64px 1fr 64px; gap: 10px; align-items: center; }
  .stepper button {
    height: 64px; border-radius: 16px; border: 1.5px solid var(--line); background: #fff;
    font-size: 30px; font-weight: 800; color: var(--ink); font-family: inherit; cursor: pointer;
  }
  .stepper .val { text-align: center; font-size: 44px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .stepper .val small { font-size: 16px; font-weight: 700; margin-left: 4px; }
  .presets { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .presets button {
    min-height: 44px; border-radius: 12px; border: 1.5px solid var(--line); background: #fff;
    font-family: inherit; font-size: 15px; font-weight: 700; color: var(--ink); cursor: pointer;
  }
  .presets button.on { background: var(--green); border-color: var(--green); color: #fff; }
</style>
</head>
<body class="board">

<div class="bar">
  <button type="button" class="target" id="b-target" aria-label="何点先取かを変更"><b id="target-num">15</b>点先取 ▾</button>
  <button type="button" id="b-undo" aria-label="1つ前に戻す">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg>戻す
  </button>
  <button type="button" id="b-reset" aria-label="0点に戻す">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>0-0
  </button>
</div>

<div class="court">
  <div class="side s0" data-side="0" role="button" aria-label="緑に1点">
    <span class="serve" id="serve0" hidden>サーブ</span>
    <div class="pts" id="pts0">0</div>
    <button type="button" class="minus" data-minus="0" aria-label="1点減らす">−</button>
  </div>
  <div class="side s1" data-side="1" role="button" aria-label="紺に1点">
    <span class="serve" id="serve1" hidden>サーブ</span>
    <div class="pts" id="pts1">0</div>
    <button type="button" class="minus" data-minus="1" aria-label="1点減らす">−</button>
  </div>
</div>

<div id="over" class="over" hidden>
  <div class="over-card">
    <div class="ttl">ゲーム終了</div>
    <div class="final"><div class="f0" id="fin0"></div><div class="f1" id="fin1"></div></div>
    <button type="button" class="btn btn-primary" id="b-new">新しいゲーム（0-0から）</button>
    <button type="button" class="btn btn-outline" id="b-over-undo">1点戻す</button>
  </div>
</div>

<script>
(function () {
  const { C, $ } = App;

  const STORE_KEY = 'rakutto-score-v2';
  const DEFAULT_TARGET = 15;
  const MIN_TARGET = 1, MAX_TARGET = 99;
  const PRESETS = [11, 15, 21, 30];
  const KEEP_HOURS = 3; // 閉じても点数を残しておく時間（先取点の設定はずっと残す）

  const fresh = (target) => ({ target: target || DEFAULT_TARGET, score: [0, 0], server: null, history: [], at: Date.now() });

  let s = load();

  function load() {
    try {
      const v = JSON.parse(localStorage.getItem(STORE_KEY));
      if (v && Array.isArray(v.score)) {
        if (Date.now() - (v.at || 0) > KEEP_HOURS * 3600 * 1000) return fresh(v.target);
        return Object.assign(fresh(), v);
      }
    } catch (e) { /* 保存できない環境では毎回初期状態 */ }
    return fresh();
  }
  function save() {
    s.at = Date.now();
    try { localStorage.setItem(STORE_KEY, JSON.stringify(s)); } catch (e) { /* 無視 */ }
  }

  /** 先取点に届いた側（0 / 1）。まだなら null */
  function winner() {
    if (s.score[0] >= s.target) return 0;
    if (s.score[1] >= s.target) return 1;
    return null;
  }

  function snapshot() {
    s.history.push({ score: s.score.slice(), server: s.server });
    if (s.history.length > 300) s.history.shift();
  }

  function add(i) {
    if (winner() !== null) return;
    snapshot();
    s.score[i]++;
    s.server = i; // バドミントンは点を取った側がサーブ
    if (navigator.vibrate) navigator.vibrate(15);
    const el = document.querySelector(`.side.s${i}`);
    el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump');
    commit();
  }

  function minus(i) {
    if (s.score[i] <= 0) return;
    snapshot();
    s.score[i]--;
    commit();
  }

  function undo() {
    const h = s.history.pop();
    if (!h) return;
    s.score = h.score;
    s.server = h.server;
    commit();
  }

  function newGame() {
    s = fresh(s.target);
    commit();
  }

  /** 試合途中で 0-0 に戻す（押し間違えても「戻す」で元に戻せる） */
  function reset() {
    snapshot();
    s.score = [0, 0];
    s.server = null;
    commit();
  }

  function commit() { save(); render(); }

  function render() {
    $('target-num').textContent = s.target;
    for (const i of [0, 1]) {
      $('pts' + i).textContent = s.score[i];
      $('serve' + i).hidden = s.server !== i;
      document.querySelector(`.side.s${i}`).classList.toggle('serving', s.server === i);
      document.querySelector(`[data-minus="${i}"]`).disabled = s.score[i] <= 0;
    }
    $('b-undo').disabled = !s.history.length;
    $('b-reset').disabled = !s.score[0] && !s.score[1];

    const w = winner();
    $('over').hidden = w === null;
    if (w !== null) {
      for (const i of [0, 1]) {
        $('fin' + i).textContent = s.score[i];
        $('fin' + i).classList.toggle('win', i === w);
      }
    }
  }

  /* ---------------- 先取点の設定 ---------------- */

  function openTarget() {
    let target = s.target;
    const bg = document.createElement('div');
    bg.className = 'sheet-bg';
    bg.innerHTML = `
      <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="st-title">
        <h2 id="st-title">何点先取？</h2>
        <div class="stepper">
          <button type="button" id="st-dec" aria-label="1点減らす">−</button>
          <div class="val"><span id="st-val"></span><small>点</small></div>
          <button type="button" id="st-inc" aria-label="1点増やす">＋</button>
        </div>
        <div class="presets" id="st-presets">${PRESETS.map((p) => `<button type="button" data-p="${p}">${p}点</button>`).join('')}</div>
        <button type="button" class="btn btn-primary" id="st-save">決定</button>
        <button type="button" class="btn btn-outline" id="st-close">やめる</button>
      </div>`;
    document.body.appendChild(bg);

    const show = () => {
      $('st-val').textContent = target;
      bg.querySelectorAll('[data-p]').forEach((b) => b.classList.toggle('on', Number(b.dataset.p) === target));
    };
    const setT = (v) => { target = Math.max(MIN_TARGET, Math.min(MAX_TARGET, v)); show(); };
    $('st-dec').addEventListener('click', () => setT(target - 1));
    $('st-inc').addEventListener('click', () => setT(target + 1));
    $('st-presets').addEventListener('click', (e) => { const b = e.target.closest('[data-p]'); if (b) setT(Number(b.dataset.p)); });
    const close = () => bg.remove();
    bg.addEventListener('click', (e) => { if (e.target === bg) close(); });
    $('st-close').addEventListener('click', close);
    $('st-save').addEventListener('click', () => { s.target = target; close(); commit(); });
    show();
  }

  /* ---------------- 画面を消さない ---------------- */

  let wakeLock = null;
  async function keepAwake() {
    try {
      if ('wakeLock' in navigator && !wakeLock && document.visibilityState === 'visible') {
        wakeLock = await navigator.wakeLock.request('screen');
        wakeLock.addEventListener('release', () => { wakeLock = null; });
      }
    } catch (e) { /* 非対応の端末では何もしない */ }
  }
  document.addEventListener('visibilitychange', keepAwake);

  /* ---------------- 操作 ---------------- */

  document.querySelectorAll('.side').forEach((el) => el.addEventListener('click', (e) => {
    keepAwake();
    const m = e.target.closest('[data-minus]');
    if (m) return minus(Number(m.dataset.minus));
    add(Number(el.dataset.side));
  }));
  $('b-undo').addEventListener('click', undo);
  $('b-over-undo').addEventListener('click', undo);
  $('b-new').addEventListener('click', newGame);
  $('b-reset').addEventListener('click', reset);
  $('b-target').addEventListener('click', openTarget);

  render();

  // LIFF は画面を全画面で開くためだけに使う（ログイン不要・通信なし）
  if (window.liff && C.SCORE_LIFF_ID && !/ここに/.test(C.SCORE_LIFF_ID)) {
    liff.init({ liffId: C.SCORE_LIFF_ID }).catch((e) => console.warn(e));
  }
})();
</script>
</body>
</html>
