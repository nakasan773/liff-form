<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ヌルっとバドミントン</title>
<link rel="stylesheet" href="style.css?v=5">
<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script src="config.js?v=5"></script>
<script src="common.js?v=5"></script>
</head>
<body>
<header class="top">
  <div class="club" id="club"></div>
  <h1 id="title">読み込み中…</h1>
</header>

<div id="loading">読み込み中…</div>

<main id="app" hidden>
  <div id="error" class="msg err" hidden></div>
  <div id="view"></div>
</main>

<script>
(function () {
  const { C, api, initLiff, day, hm, range, esc, $, showError, genderTag } = App;
  const TITLES = { join: '参加登録', next: '次回開催日時', profile: 'プロフィール' };
  let page = 'join';
  let state = null;
  let pollTimer = null;

  $('club').textContent = C.CIRCLE_NAME;

  /* ---------------- 表示パーツ ---------------- */

  function eventCard(ev, label) {
    return `<div class="event-card">
      <div class="label">${esc(label)}</div>
      <div class="date">${esc(range(ev))}</div>
      <div class="place">${esc(ev.place)}</div>
    </div>`;
  }

  function waitingText(ev) {
    return `次回の開催日は${esc(day(ev.start))} ${esc(hm(ev.start))}〜${esc(hm(ev.end))}。<br>
      場所は${esc(ev.place)}です。<br>
      開催30分前（${esc(hm(ev.opensAt))}）になったら「参加」ボタンが表示されます。お待ちください。`;
  }

  const NONE_TEXT = '次回の開催日は未定です。<br>決まり次第こちらでご案内します。';

  function profileForm(p, submitLabel, lead) {
    p = p || {};
    const radio = (name, value, id) =>
      `<input type="radio" name="${name}" id="${id}" value="${value}" ${p[name] === value ? 'checked' : ''}><label for="${id}">${value}</label>`;
    return `
    <div class="card">
      ${lead ? `<div class="muted">${lead}</div>` : ''}
      <div class="row2">
        <div class="field">
          <label class="label" for="f-sei">姓（苗字）<span class="req"> 必須</span></label>
          <input id="f-sei" type="text" maxlength="15" placeholder="例：山田" autocomplete="family-name" value="${esc(p.sei || '')}">
        </div>
        <div class="field">
          <label class="label" for="f-mei">名（名前）<span class="req"> 必須</span></label>
          <input id="f-mei" type="text" maxlength="15" placeholder="例：健" autocomplete="given-name" value="${esc(p.mei || '')}">
        </div>
      </div>
      <div class="field">
        <label class="label" for="f-nick">ニックネーム<span class="req"> 必須</span></label>
        <input id="f-nick" type="text" maxlength="12" placeholder="例：やまけん" autocomplete="nickname" value="${esc(p.nickname || '')}">
        <div class="muted">組み合わせ表や参加者一覧に表示される名前です（12文字まで）</div>
      </div>
      <div class="field">
        <div class="label">性別<span class="req"> 必須</span></div>
        <div class="choices c3">${radio('gender', '男性', 'g1')}${radio('gender', '女性', 'g2')}${radio('gender', '回答しない', 'g3')}</div>
      </div>
      <div class="field">
        <div class="label">バドミントン経験<span class="req"> 必須</span></div>
        <div class="choices c2">${radio('experience', '経験者', 'e1')}${radio('experience', '未経験', 'e2')}</div>
      </div>
      <div class="field" id="years-field" ${p.experience === '経験者' ? '' : 'hidden'}>
        <div class="label">経験年数<span class="req"> 必須</span></div>
        <div class="choices c2">
          ${radio('years', '1年未満', 'y1')}${radio('years', '1〜3年', 'y2')}${radio('years', '3〜5年', 'y3')}${radio('years', '5年以上', 'y4')}
        </div>
      </div>
      <div class="field">
        <label class="label" for="f-hobby">趣味・ひとこと<span class="opt"> 任意</span></label>
        <textarea id="f-hobby" maxlength="100" placeholder="例：キャンプ、ラーメン巡り">${esc(p.hobby || '')}</textarea>
        <div class="counter"><span id="f-count">${(p.hobby || '').length}</span> / 100</div>
      </div>
      <button id="f-submit" class="btn btn-primary" type="button">${esc(submitLabel)}</button>
      <p class="muted center">ニックネーム・性別・趣味は、開催中に参加者どうしで表示されます。<br>姓・名は主催者だけが見られます。経験年数は組み合わせにのみ使います。</p>
    </div>`;
  }

  function bindProfileForm(onSubmit) {
    const val = (n) => (document.querySelector(`input[name="${n}"]:checked`) || {}).value || '';
    document.querySelectorAll('input[name="experience"]').forEach((el) =>
      el.addEventListener('change', () => { $('years-field').hidden = val('experience') !== '経験者'; }));
    $('f-hobby').addEventListener('input', () => { $('f-count').textContent = $('f-hobby').value.length; });
    $('f-submit').addEventListener('click', async () => {
      const data = {
        sei: $('f-sei').value.trim(), mei: $('f-mei').value.trim(), nickname: $('f-nick').value.trim(),
        gender: val('gender'),
        experience: val('experience'), years: val('years'), hobby: $('f-hobby').value.trim(),
      };
      if (!data.sei) return showError('姓（苗字）を入力してください');
      if (!data.mei) return showError('名（名前）を入力してください');
      if (!data.nickname) return showError('ニックネームを入力してください');
      if (!data.gender) return showError('性別を選択してください');
      if (!data.experience) return showError('経験の有無を選択してください');
      if (data.experience === '経験者' && !data.years) return showError('経験年数を選択してください');
      await busy($('f-submit'), '送信中…', () => onSubmit(data));
    });
  }

  function participantsHtml(list) {
    const items = list.map((p) => `
      <div class="person">
        <div class="name">${esc(p.name)} ${genderTag(p.gender)}</div>
        ${p.hobby ? `<div class="hobby">${esc(p.hobby)}</div>` : ''}
      </div>`).join('');
    return `
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <h2>今日の参加者</h2>
        <div><span class="count-badge">${list.length}</span> 人</div>
      </div>
      <span class="live">自動で更新されます</span>
    </div>
    <div class="list">${items}</div>`;
  }

  /* ---------------- 現在地の取得 ---------------- */

  function getLocation() {
    return new Promise((resolve, reject) => {
      if (!navigator.geolocation) {
        return reject(new Error('この端末では位置情報を使えません'));
      }
      navigator.geolocation.getCurrentPosition(
        (pos) => resolve({ lat: pos.coords.latitude, lng: pos.coords.longitude, accuracy: pos.coords.accuracy }),
        (err) => {
          if (err.code === err.PERMISSION_DENIED) {
            reject(new Error('位置情報の利用が許可されていません。iPhone：設定 → LINE → 位置情報 →「このAppの使用中のみ許可」。Android：設定 → アプリ → LINE → 権限 → 位置情報 →「許可」。変更後、この画面を開き直してください'));
          } else if (err.code === err.TIMEOUT) {
            reject(new Error('現在地を取得できませんでした。入口や窓の近くでもう一度お試しください'));
          } else {
            reject(new Error('現在地を取得できませんでした。スマホの位置情報サービスがオンになっているか確認してください'));
          }
        },
        { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
      );
    });
  }

  async function joinWithLocation() {
    const location = await getLocation();
    state = await api('join', { location });
    renderJoin();
  }

  async function busy(btn, label, fn) {
    const orig = btn.textContent;
    btn.disabled = true; btn.textContent = label; showError('');
    try { await fn(); }
    catch (e) { showError(e.message); btn.disabled = false; btn.textContent = orig; }
  }

  /* ---------------- 各ページ ---------------- */

  function renderJoin() {
    const s = state, v = $('view');
    stopPoll();

    if (s.phase === 'none') {
      v.innerHTML = `<div class="card center"><div class="big-msg">${NONE_TEXT}</div></div>`;
      return;
    }
    if (s.phase === 'waiting') {
      v.innerHTML = `${eventCard(s.event, '次回の開催')}
        <div class="card"><div class="big-msg">${waitingText(s.event)}</div></div>`;
      return;
    }

    // ---- 受付中 ----
    if (!s.profile || !s.profile.complete) {
      const lead = s.profile
        ? '登録項目が増えました。姓・名・ニックネームを入力してから参加してください。'
        : 'はじめての方は、最初にプロフィールを登録してください。次回からは「参加」ボタンを押すだけです。<br>参加時に現在地を確認するので、会場の近くで登録してください。';
      v.innerHTML = eventCard(s.event, '本日の開催') + profileForm(s.profile, '登録して参加する', lead);
      bindProfileForm(async (data) => {
        const location = await getLocation(); // 先に位置情報の許可を取る
        await api('saveProfile', { data });
        state = await api('join', { location });
        renderJoin();
      });
      return;
    }

    if (!s.joined) {
      v.innerHTML = `${eventCard(s.event, '本日の開催')}
        <div class="card center">
          <div class="muted">${esc(s.profile.nickname)} さん、ようこそ！</div>
          <button id="join" class="join-btn" type="button">参加</button>
          <div class="muted">押すと現在地を確認して、今日の参加者として登録します。<br>会場の近くで押してください（位置情報は保存しません）</div>
        </div>`;
      $('join').addEventListener('click', () => busy($('join'), '確認中', joinWithLocation));
      return;
    }

    v.innerHTML = `<div class="msg ok">参加を受け付けました。楽しんでいきましょう！</div>
      ${eventCard(s.event, '本日の開催')}
      <div id="plist">${participantsHtml(s.participants || [])}</div>`;
    startPoll();
  }

  function renderNext() {
    const s = state, v = $('view');
    if (!s.event) {
      v.innerHTML = `<div class="card center"><div class="big-msg">${NONE_TEXT}</div></div>`;
      return;
    }
    const note = s.phase === 'open'
      ? (s.joined ? 'この開催には参加済みです。' : '現在、参加受付中です。メニューの「参加登録」から参加してください。')
      : `参加受付は開催30分前（${esc(day(s.event.opensAt))} ${esc(hm(s.event.opensAt))}）から始まります。`;
    v.innerHTML = `${eventCard(s.event, s.phase === 'open' ? '本日の開催' : '次回の開催')}
      <div class="card"><div class="big-msg" style="font-size:16px">${note}</div></div>`;
  }

  function renderProfile() {
    const s = state, v = $('view');
    v.innerHTML = profileForm(s.profile, s.profile ? '変更を保存する' : '登録する',
      s.profile ? '登録内容を変更できます。' : 'まだプロフィールが登録されていません。');
    bindProfileForm(async (data) => {
      state = await api('saveProfile', { data });
      v.innerHTML = `<div class="msg ok">保存しました。</div>
        <button id="close" class="btn btn-primary" type="button">閉じる</button>`;
      $('close').addEventListener('click', () => (liff.isInClient() ? liff.closeWindow() : renderProfile()));
    });
  }

  function render() {
    $('title').textContent = TITLES[page];
    ({ join: renderJoin, next: renderNext, profile: renderProfile })[page]();
  }

  /* ---------------- 参加者一覧の自動更新 ---------------- */

  function startPoll() {
    stopPoll();
    pollTimer = setInterval(async () => {
      if (document.visibilityState !== 'visible') return;
      try {
        const s = await api('status');
        const changed = s.phase !== state.phase || s.joined !== state.joined;
        state = s;
        if (changed) return renderJoin();
        $('plist').innerHTML = participantsHtml(s.participants || []);
      } catch (e) { /* 一時的な通信エラーは次回に再試行 */ }
    }, (C.POLL_SECONDS || 20) * 1000);
  }
  function stopPoll() { if (pollTimer) clearInterval(pollTimer); pollTimer = null; }

  /* ---------------- 起動 ---------------- */

  async function main() {
    try {
      if (!(await initLiff(C.LIFF_ID))) return;
      const q = new URLSearchParams(location.search).get('page');
      if (TITLES[q]) page = q;
      state = await api('status');
      $('loading').hidden = true;
      $('app').hidden = false;
      render();
    } catch (e) {
      $('loading').textContent = e.message || '読み込みに失敗しました。LINEアプリから開き直してください。';
      console.error(e);
    }
  }
  main();
})();
</script>
</body>
</html>
